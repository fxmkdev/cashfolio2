name: Cleanup nonproduction databases
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
env:
  NODE_VERSION: 26

jobs:
  cleanup-preview:
    if:
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-cashfolio-app
    concurrency:
      group: cashfolio-app2-nonproduction
      cancel-in-progress: false
    steps:
      - name: Require default-branch cleanup
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install cleanup tooling
        run:
          pnpm --filter cashfolio-app2 install --frozen-lockfile
          --ignore-scripts
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.115
      - name: Remove retired preview apps and unused databases
        run: node apps/cashfolio-app2/scripts/preview/cleanup.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_CASHFOLIO_APP_STAGING_APP:
            ${{ vars.FLY_CASHFOLIO_APP_STAGING_APP }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NONPRODUCTION_NEON_PROJECT_ID:
            ${{ vars.NONPRODUCTION_NEON_PROJECT_ID }}
      - name: Cleanup outcome
        if: always()
        run: |
          echo "Outcome: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
        env:
          OUTCOME: ${{ job.status }}
