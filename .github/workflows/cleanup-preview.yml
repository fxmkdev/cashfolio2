name: Cleanup dynamic preview
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  cleanup-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-cashfolio-provision
    concurrency:
      group: cashfolio-app2-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install trusted tooling without PR caches
        run:
          pnpm --filter cashfolio-app2 install --frozen-lockfile
          --ignore-scripts
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.115
      - name: Remove preview app, database and roles
        run: node apps/cashfolio-app2/scripts/preview/cleanup.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_ADMIN_URL: ${{ secrets.PREVIEW_DATABASE_ADMIN_URL }}
          PREVIEW_DATABASE_TARGET: ${{ vars.PREVIEW_DATABASE_TARGET }}
      - name: Cleanup summary
        if: always()
        run: |
          {
            echo '### Preview cleanup'
            echo "PR: #$PR_NUMBER"
            echo "Outcome: $OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ job.status }}
