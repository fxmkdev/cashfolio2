name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a release even without a !release commit marker
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: 26
  FLYCTL_VERSION: 0.4.115

jobs:
  version:
    name: "Generate version"
    uses: ./.github/workflows/version.yml
    with:
      force_release:
        ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}

  cashfolio-app2-build-push:
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: "cashfolio-app2: Build and Push"
    runs-on: ubuntu-latest
    needs: [version]
    outputs:
      preview_image: ${{ steps.preview-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set version on cashfolio-app2
        # pnpm's native version command only bumps packages that already
        # have a version field. cashfolio-app2 is versionless in git, so use
        # npm only as a package.json editor for this CI-only image stamp.
        run: |
          npm pkg set version=${{ needs.version.outputs.version }}
        working-directory: apps/cashfolio-app2
      - name: Get cashfolio-app2 image name
        id: image-name
        run: |
          set -euo pipefail
          : "${IMAGE_APP:?Image app configuration is required}"
          IMAGE_NAME="$IMAGE_APP"
          IMAGE_TAG="v${VERSION}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            IMAGE_TAG="pr-${PR_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          {
            echo "image_name=$IMAGE_NAME"
            echo "image_tag=$IMAGE_TAG"
            echo "image=registry.fly.io/$IMAGE_NAME:$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE_APP: ${{ vars.FLY_CASHFOLIO_APP_STAGING_APP }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ needs.version.outputs.version_with_sha }}
      - name: Build and push cashfolio-app2 Docker image
        run: |
          flyctl deploy \
            --app ${{ steps.image-name.outputs.image_name }} \
            --config apps/cashfolio-app2/fly.build.toml \
            --build-only \
            --image-label ${{ steps.image-name.outputs.image_tag }} \
            --label org.opencontainers.image.version=${{ steps.image-name.outputs.image_tag }} \
            --push \
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Authenticate to preview image registry
        if: github.event_name == 'pull_request'
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Resolve immutable preview image
        id: preview-image
        if: github.event_name == 'pull_request'
        run: node apps/cashfolio-app2/scripts/preview/resolve-image.ts
        env:
          IMAGE: ${{ steps.image-name.outputs.image }}
          FLY_CASHFOLIO_APP_STAGING_APP:
            ${{ vars.FLY_CASHFOLIO_APP_STAGING_APP }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}

  cashfolio-app2-e2e:
    name:
      "cashfolio-app2: E2E (Shard ${{ matrix.shard_index }}/${{
      matrix.shard_total }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3]
        shard_total: [3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashfolio" --health-interval
          10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashfolio?schema=public
      BASE_URL: http://127.0.0.1:4173
      APP_ENVIRONMENT: e2e
      E2E_AUTH_EXTERNAL_ID: e2e-user
      E2E_WORKERS: "2"
      E2E_SHARD: ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Migrate test database
        run: pnpm --filter cashfolio-app2 exec prisma migrate deploy
      - name: Install Playwright browser
        run: |
          pnpm --filter cashfolio-app2 exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm --filter cashfolio-app2 e2e:ci
      - name: Upload Playwright timing artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:
            cashfolio-app2-playwright-timings-${{ matrix.shard_index }}-of-${{
            matrix.shard_total }}
          path: apps/cashfolio-app2/test-results/results.json
          if-no-files-found: ignore
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name:
            cashfolio-app2-playwright-artifacts-${{ matrix.shard_index }}-of-${{
            matrix.shard_total }}
          path: |
            apps/cashfolio-app2/playwright-report
            apps/cashfolio-app2/test-results
          if-no-files-found: ignore

  cashfolio-app2-e2e-required:
    name: "cashfolio-app2: E2E Required"
    runs-on: ubuntu-latest
    needs: [cashfolio-app2-e2e]
    if: ${{ !cancelled() }}
    steps:
      - name: Check matrix shard aggregate result
        run: |
          if [ "${{ needs.cashfolio-app2-e2e.result }}" != "success" ]; then
            echo "E2E shards did not all succeed (result=${{ needs.cashfolio-app2-e2e.result }})."
            exit 1
          fi

  cashfolio-app2-staging-seed:
    name: "cashfolio-app2: Staging seed integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashfolio" --health-interval
          10s --health-timeout 5s --health-retries 5
    env:
      STAGING_SEED_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Verify preview provisioning and deployment controls
        run: pnpm --filter cashfolio-app2 test:preview
      - name: Verify transactional seed against PostgreSQL
        run: pnpm --filter cashfolio-app2 test:staging-seed
      - name: Verify concurrent accounting mutations against PostgreSQL
        env:
          MUTATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm --filter cashfolio-app2 test:mutations
      - name: Build standalone seed payload
        run: pnpm --filter cashfolio-app2 build:staging-seed
      - name: Verify standalone CSV export without database credentials
        run:
          node apps/cashfolio-app2/dist/staging-seed/seed.mjs --sample-csv >
          /tmp/cashfolio-staging-import.csv

  cashfolio-app2-provider-usage-cleanup:
    name: "cashfolio-app2: Provider usage cleanup integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PROVIDER_USAGE_CLEANUP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Verify Fly Machine lifecycle
        run: pnpm --filter cashfolio-app2 test:provider-usage-cleanup-runner
      - name: Verify PostgreSQL batching and standalone payload
        run: pnpm --filter cashfolio-app2 test:provider-usage-cleanup

  cashfolio-app2-unit:
    name: "cashfolio-app2: Unit + Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Generate Prisma Client
        run: pnpm --filter cashfolio-app2 prisma:generate
      - name: Run unit tests with coverage ratchet
        run: pnpm --filter cashfolio-app2 test:unit:coverage:ratchet
      - name: Upload unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cashfolio-app2-unit-coverage
          path: apps/cashfolio-app2/coverage
          if-no-files-found: ignore

  cashfolio-app2-typecheck:
    name: "cashfolio-app2: Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Generate Prisma Client
        run: pnpm --filter cashfolio-app2 prisma:generate
      - name: Run typecheck
        run: pnpm --filter cashfolio-app2 typecheck

  cashfolio-app2-format:
    name: "cashfolio-app2: Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install
      - name: Run format check
        run: pnpm --filter cashfolio-app2 format

  cashfolio-app2-lint:
    name: "cashfolio-app2: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Run lint
        run: pnpm --filter cashfolio-app2 lint

  cashfolio-app2-storybook-tests:
    name: "cashfolio-app2: Storybook Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Generate Prisma Client
        run: pnpm --filter cashfolio-app2 prisma:generate
      - name: Install Playwright browser
        run: |
          pnpm --filter cashfolio-app2 exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm --filter cashfolio-app2 build-storybook
      - name: Run Storybook and Temporal tests
        run:
          pnpm --filter cashfolio-app2 exec vitest run --project storybook
          --project 'temporal-*'
      - name: Upload Storybook failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cashfolio-app2-storybook-failures
          path: apps/cashfolio-app2/.vitest
          if-no-files-found: ignore

  github-actions-lint:
    name: "GitHub Actions: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run actionlint
        run: pnpm lint:workflows

  cli-typecheck:
    name: "cli: Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cli install
      - name: Run typecheck in cli
        run: pnpm --filter cli typecheck

  cli-tests:
    name: "cli: Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cli install --frozen-lockfile
      - name: Run CLI tests
        run: pnpm --filter cli test

  storybook-publish:
    name: "cashfolio-app2: Publish Storybook"
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref ==
      'refs/heads/main' || (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: >-
        ${{ github.event_name == 'pull_request' && 'preview-cashfolio-storybook'
        || 'staging-cashfolio-storybook' }}
      url: ${{ steps.publish-chromatic.outputs.storybookUrl }}
    concurrency:
      group: >-
        storybook-${{ github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || format('ref-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cashfolio-app2 install
      - name: Generate Prisma Client
        run: pnpm --filter cashfolio-app2 prisma:generate
      - name: Build Storybook
        run: pnpm --filter cashfolio-app2 build-storybook
      - name: Publish Storybook to Chromatic
        id: publish-chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/cashfolio-app2/storybook-static
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: true

  preview-deploy:
    name: "Deploy to preview / cashfolio-app2: Deploy"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    needs: cashfolio-app2-build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview-cashfolio-app
      url: ${{ steps.prepare.outputs.preview_url }}
    concurrency:
      group: cashfolio-app2-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install preview tooling
        run:
          pnpm --filter cashfolio-app2 install --frozen-lockfile
          --ignore-scripts
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Provision database and stage preview-only credentials
        id: prepare
        run: node apps/cashfolio-app2/scripts/preview/prepare.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_IMAGE:
            ${{ needs.cashfolio-app2-build-push.outputs.preview_image }}
          FLY_CASHFOLIO_APP_STAGING_APP:
            ${{ vars.FLY_CASHFOLIO_APP_STAGING_APP }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIEW_DATABASE_ADMIN_URL: ${{ secrets.PREVIEW_DATABASE_ADMIN_URL }}
          PREVIEW_DATABASE_TARGET: ${{ vars.PREVIEW_DATABASE_TARGET }}
          PREVIEW_DATABASE_PASSWORD_KEY:
            ${{ secrets.PREVIEW_DATABASE_PASSWORD_KEY }}
          SEED_USER_EXTERNAL_IDS: ${{ secrets.SEED_USER_EXTERNAL_IDS }}
          SEED_ADMIN_EXTERNAL_IDS: ${{ secrets.SEED_ADMIN_EXTERNAL_IDS }}
          LOGTO_APP_SECRET: ${{ secrets.LOGTO_APP_SECRET }}
          LOGTO_MANAGEMENT_API_APP_SECRET:
            ${{ secrets.LOGTO_MANAGEMENT_API_APP_SECRET }}
          CURRENCYLAYER_API_KEY: ${{ secrets.CURRENCYLAYER_API_KEY }}
          COINLAYER_API_KEY: ${{ secrets.COINLAYER_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      - name: Deploy and seed preview
        uses: ./.github/actions/deploy-cashfolio-app2
        with:
          image: ${{ needs.cashfolio-app2-build-push.outputs.preview_image }}
          high_availability: "false"
          app_environment: preview
          release_command:
            node apps/cashfolio-app2/dist/staging-seed/seed.mjs --release
          fly_app: ${{ steps.prepare.outputs.fly_app }}
          canonical_hostname: ${{ steps.prepare.outputs.preview_hostname }}
          base_url: ${{ steps.prepare.outputs.preview_url }}
          fly_primary_region: ${{ vars.FLY_PRIMARY_REGION }}
          fly_min_machines_running: ${{ vars.FLY_MIN_MACHINES_RUNNING }}
          fly_memory: ${{ vars.FLY_MEMORY }}
          fly_cpu_kind: ${{ vars.FLY_CPU_KIND }}
          fly_cpus: ${{ vars.FLY_CPUS }}
          logto_endpoint: ${{ vars.LOGTO_ENDPOINT }}
          logto_app_id: ${{ vars.LOGTO_APP_ID }}
          logto_management_api_endpoint:
            ${{ vars.LOGTO_MANAGEMENT_API_ENDPOINT }}
          logto_management_api_resource:
            ${{ vars.LOGTO_MANAGEMENT_API_RESOURCE }}
          logto_management_api_app_id: ${{ vars.LOGTO_MANAGEMENT_API_APP_ID }}
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
      - name: Wake preview
        uses: ./.github/actions/warm-up-url
        with:
          url: ${{ steps.prepare.outputs.preview_url }}
      - name: Update preview link on PR
        run: node apps/cashfolio-app2/scripts/preview/publish.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.prepare.outputs.preview_url }}
          PREVIEW_DATABASE: ${{ steps.prepare.outputs.database }}
      - name: Deployment summary
        if: always()
        run: |
          {
            echo '### Preview deployment and seed'
            echo "PR: #$PR_NUMBER"
            echo "Commit: $PR_SHA"
            echo "Preview: ${PREVIEW_URL:-unavailable}"
            echo "Outcome: $OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.prepare.outputs.preview_url }}
          OUTCOME: ${{ job.status }}

  deploy:
    name: Deploy to staging
    if: github.event_name != 'pull_request'
    needs:
      - version
      - cashfolio-app2-build-push
      - cashfolio-app2-unit
      - cashfolio-app2-staging-seed
      - cashfolio-app2-e2e-required
      - cashfolio-app2-typecheck
      - cashfolio-app2-lint
      - cashfolio-app2-storybook-tests
      - cashfolio-app2-format
      - github-actions-lint
      - cli-typecheck
      - cli-tests
    uses: ./.github/workflows/deploy-version.yml
    with:
      version_with_sha: ${{ needs.version.outputs.version_with_sha }}
      sha: ${{ needs.version.outputs.sha }}
      environment: staging
      deploy-cashfolio-redis: false
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      needs.version.outputs.is_new_release == 'true'
    needs:
      - deploy
      - version
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --workspace-root install --frozen-lockfile
      - name: Publish release
        run: pnpm releaser publish ${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
