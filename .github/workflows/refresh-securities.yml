name: Refresh securities catalogue
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to refresh
        type: choice
        options: [prod, staging, preview]
        default: prod
        required: true
      preview_app:
        description: Existing preview app name (required for preview)
        type: string
      preview_region:
        description: Existing preview primary region (required for preview)
        type: string
permissions:
  contents: read
env:
  NODE_VERSION: 26
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      ${{ inputs.environment == 'preview' && 'preview-cashfolio-app' ||
      inputs.environment == 'staging' && 'staging-cashfolio-app' ||
      'prod-cashfolio-app' }}
    concurrency:
      group:
        securities-refresh-${{ inputs.preview_app || inputs.environment ||
        'prod' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install runner dependencies
        run: pnpm --filter cashfolio-app2 install --frozen-lockfile
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.115
      - name: Validate preview target
        if: inputs.environment == 'preview'
        env:
          PREVIEW_APP: ${{ inputs.preview_app }}
          PREVIEW_REGION: ${{ inputs.preview_region }}
        run: |
          [[ "$PREVIEW_APP" =~ ^cashfolio-app2-pr-[0-9]+(-[a-z0-9-]+)?$ ]] || { echo 'Invalid preview app'; exit 1; }
          [[ "$PREVIEW_REGION" =~ ^[a-z]{3}$ ]] || { echo 'Invalid preview region'; exit 1; }
      - name: Refresh catalogue in deployed image
        run:
          pnpm --filter cashfolio-app2 exec node
          scripts/run-securities-refresh.ts
        env:
          FLY_APP:
            ${{ inputs.environment == 'preview' && inputs.preview_app ||
            vars.FLY_APP }}
          FLY_PRIMARY_REGION:
            ${{ inputs.environment == 'preview' && inputs.preview_region ||
            vars.FLY_PRIMARY_REGION }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
