name: Deploy version
on:
  workflow_call:
    inputs:
      version_with_sha:
        type: string
        required: true
      sha:
        type: string
        required: true
      environment:
        type: string
        required: true
      high_availability:
        type: boolean
        default: true
      deploy-cashfolio-app2:
        type: boolean
        default: true
      deploy-cashfolio-redis:
        type: boolean
        default: true
      cashfolio_app2_image:
        type: string
        required: false
      fly_app:
        type: string
        required: false
      canonical_hostname:
        type: string
        required: false
      base_url:
        type: string
        required: false
      app_environment_name:
        type: string
        required: false
      app_environment_url:
        type: string
        required: false

env:
  NODE_VERSION: 26
  FLYCTL_VERSION: 0.4.115

jobs:
  cashfolio-app2-deploy:
    name: "cashfolio-app2: Deploy"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy-cashfolio-app2 }}
    concurrency:
      group:
        ${{ inputs.environment == 'prod' &&
        format('cashfolio-app2-deploy-prod-{0}', inputs.fly_app || 'shared') ||
        'cashfolio-app2-nonproduction' }}
      cancel-in-progress: false
    environment:
      name:
        ${{ inputs.app_environment_name || format('{0}-cashfolio-app',
        inputs.environment) }}
      url:
        ${{ inputs.app_environment_url || format('https://{0}/',
        inputs.canonical_hostname || vars.CANONICAL_HOSTNAME) }}
    steps:
      - name: Validate deployment environment
        run: |
          case "$APP_ENVIRONMENT" in
            staging|prod) ;;
            *) echo "Unsupported deployment environment" >&2; exit 1 ;;
          esac
        env:
          APP_ENVIRONMENT: ${{ inputs.environment }}
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup nonproduction tooling
        if: inputs.environment == 'staging'
        uses: ./.github/actions/setup
      - name: Install nonproduction tooling
        if: inputs.environment == 'staging'
        run:
          pnpm --filter cashfolio-app2 install --frozen-lockfile
          --ignore-scripts
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Provision staging database and stage seed settings
        if: inputs.environment == 'staging'
        id: database
        run: node apps/cashfolio-app2/scripts/nonproduction/stage.ts
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NONPRODUCTION_NEON_PROJECT_ID:
            ${{ vars.NONPRODUCTION_NEON_PROJECT_ID }}
          SOURCE_BRANCH:
            ${{ github.ref_type == 'branch' && github.ref_name ||
            github.event.repository.default_branch }}
          DEPLOY_SHA: ${{ inputs.sha }}
          FLY_APP: ${{ inputs.fly_app || vars.FLY_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SEED_USER_EXTERNAL_IDS: ${{ secrets.SEED_USER_EXTERNAL_IDS }}
          SEED_ADMIN_EXTERNAL_IDS: ${{ secrets.SEED_ADMIN_EXTERNAL_IDS }}
      - name: Deploy cashfolio-app2
        uses: ./.github/actions/deploy-cashfolio-app2
        with:
          image:
            ${{ inputs.cashfolio_app2_image ||
            format('registry.fly.io/{0}:v{1}',
            vars.FLY_CASHFOLIO_APP_STAGING_APP, inputs.version_with_sha) }}
          database_project_id: ${{ steps.database.outputs.database_project_id }}
          nonproduction_neon_project_id:
            ${{ inputs.environment == 'staging' &&
            vars.NONPRODUCTION_NEON_PROJECT_ID || '' }}
          database_branch_id: ${{ steps.database.outputs.database_branch_id }}
          database_name: ${{ steps.database.outputs.database }}
          deploy_sha: ${{ inputs.sha }}
          high_availability: ${{ inputs.high_availability }}
          app_environment: ${{ inputs.environment }}
          release_command:
            ${{ inputs.environment == 'staging' && 'node
            apps/cashfolio-app2/dist/staging-seed/seed.mjs --release' || 'sh
            apps/cashfolio-app2/scripts/prisma-migrate-deploy-with-retry.sh' }}
          fly_app: ${{ inputs.fly_app || vars.FLY_APP }}
          canonical_hostname:
            ${{ inputs.canonical_hostname || vars.CANONICAL_HOSTNAME }}
          base_url: ${{ inputs.base_url || vars.BASE_URL }}
          fly_primary_region: ${{ vars.FLY_PRIMARY_REGION }}
          fly_min_machines_running: ${{ vars.FLY_MIN_MACHINES_RUNNING }}
          fly_memory: ${{ vars.FLY_MEMORY }}
          fly_cpu_kind: ${{ vars.FLY_CPU_KIND }}
          fly_cpus: ${{ vars.FLY_CPUS }}
          logto_endpoint: ${{ vars.LOGTO_ENDPOINT }}
          logto_app_id: ${{ vars.LOGTO_APP_ID }}
          logto_management_api_endpoint:
            ${{ vars.LOGTO_MANAGEMENT_API_ENDPOINT }}
          logto_management_api_resource:
            ${{ vars.LOGTO_MANAGEMENT_API_RESOURCE }}
          logto_management_api_app_id: ${{ vars.LOGTO_MANAGEMENT_API_APP_ID }}
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
      - name: Wake up deployed app
        uses: ./.github/actions/warm-up-url
        with:
          url:
            ${{ inputs.app_environment_url || inputs.base_url ||
            format('https://{0}/', inputs.canonical_hostname ||
            vars.CANONICAL_HOSTNAME) }}
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### $DEPLOY_ENV deployment"
            echo "Commit: $DEPLOY_SHA"
            echo "Application: $DEPLOY_URL"
            echo "Database: ${DEPLOY_DATABASE:-unavailable}"
            echo "Outcome: $OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_SHA: ${{ inputs.sha }}
          DEPLOY_URL: ${{ inputs.base_url || vars.BASE_URL }}
          DEPLOY_DATABASE:
            ${{ inputs.environment == 'prod' && 'existing production database'
            || steps.database.outputs.database }}
          OUTCOME: ${{ job.status }}

  cashfolio-redis-deploy:
    name: "cashfolio-redis: Deploy"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy-cashfolio-redis }}
    environment:
      name: ${{ inputs.environment }}-cashfolio-redis
      url: https://${{ vars.CANONICAL_HOSTNAME }}/
    steps:
      - name: Validate deployment environment
        run: |
          case "$APP_ENVIRONMENT" in
            staging|prod) ;;
            *) echo "Unsupported deployment environment" >&2; exit 1 ;;
          esac
        env:
          APP_ENVIRONMENT: ${{ inputs.environment }}
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Prepare configuration file
        run: |
          envsubst \
              < infra/cashfolio-redis/fly.template.toml \
              > infra/cashfolio-redis/fly.generated.toml \

          echo "Generated configuration file:"
          cat infra/cashfolio-redis/fly.generated.toml
        env:
          FLY_APP: ${{ vars.FLY_APP }}
          FLY_PRIMARY_REGION: ${{ vars.FLY_PRIMARY_REGION }}
          FLY_MIN_MACHINES_RUNNING: ${{ vars.FLY_MIN_MACHINES_RUNNING }}
          FLY_MEMORY: ${{ vars.FLY_MEMORY }}
          FLY_CPU_KIND: ${{ vars.FLY_CPU_KIND }}
          FLY_CPUS: ${{ vars.FLY_CPUS }}
      - name: Deploy cashfolio-redis
        run: |
          flyctl deploy \
          --config infra/cashfolio-redis/fly.generated.toml \
          --ha=false \
          --image registry.fly.io/${{ vars.FLY_CASHFOLIO_REDIS_STAGING_APP }}:v${{ inputs.version_with_sha }} \
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
