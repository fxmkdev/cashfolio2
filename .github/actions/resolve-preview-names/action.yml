name: Resolve preview resource names
description: Resolve preview names without executing PR-controlled shell input.
inputs:
  pr_number:
    description: Pull request number
    required: true
  head_ref:
    description: Pull request branch name
    required: true
  pr_title:
    description: Pull request title used for the database name
    required: true
outputs:
  fly_app:
    value: ${{ steps.resolve.outputs.fly_app }}
    description: Fly app name
  fly_app_legacy:
    value: ${{ steps.resolve.outputs.fly_app_legacy }}
    description: Legacy Fly app name
  preview_hostname:
    value: ${{ steps.resolve.outputs.preview_hostname }}
    description: Preview hostname
  preview_url:
    value: ${{ steps.resolve.outputs.preview_url }}
    description: Preview URL
  database_name:
    value: ${{ steps.resolve.outputs.database_name }}
    description:
      Initial database name; provisioning reuses an existing database after
      title edits
runs:
  using: composite
  steps:
    - name: Resolve names
      id: resolve
      shell: bash
      run: node apps/cashfolio-app2/scripts/preview/names.ts
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_REF: ${{ inputs.head_ref }}
        PR_TITLE: ${{ inputs.pr_title }}
